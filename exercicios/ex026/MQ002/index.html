<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css" media="all"> <!--Para todo o tipo de midia-->
    <link rel="stylesheet" href="estilo/retrato.css" media="screen and (orientation: portrait)"> <!--COnfiguração adicional-->
    <link rel="stylesheet" href="estilo/paisagem.css" media="screen and orientation: landscape"> <!--Configuração adicional-->
    <!--Media types são escritas em aspas, normal. EX: "all".
    Media features são escritas entre parênteses isoladamenstes, cada midia features com seu parênteses. EX: (orientatios: portrait) -->
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>

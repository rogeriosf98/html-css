<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de formulário</title>
</head>
<body>
    <h1>Checkbox e radio</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="name" id="isxmas" value="M"> <label for="isxmas">Masculino</label>
            <input type="radio" name="name" id="isxfem" value="F"> <label for="isxfem">Feminino</label>
        </fieldset>
        <!--Aprendendo so "Radio" - Com essa função, podemos colocar o mesmo name, para as duas opções de marcação acima (masculino e feminino), e dessa forma, você seleciona um, ou outro. Caso contrário, o usuário pode selecionar as duas opções. LEMBRE-SE: O ID TEM QUE SER DIFERENTE PARA O LABEL FUNCIONAR. SÓ O NAME É IGUAL (SEXO)-->
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesbfut">Futebol</label><br>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label><br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label><br>
            <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tenis</label><br>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocapitalize="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="name" id="inome" minlength="5" max="30">
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="on">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="Itel" autocomplete="tel" pattern="^[\(\d{2})\d{4,5}-\d{4}$" placeholder="(xx)XXXX-XXXX">
            </p>
        </fieldset>
        <!--Estudar mais sobre RegEx (Expressões regulares) EX pattern="^[0-9]{4}-[0-9]{4}$" significa, 4 dígitos de 0 a 9, um traço (-) mais 4 dpigitos de 0 9.   -    Em outro exemplo "^[\d{4,5}-\d{4}$" - De 4 a 5 dígitos, traço, 4 dígitos 
        
        Agora para adicionar o DDD, no exemplo acima, assim como um expressão algébrica, é necessário abrir parênteses, e para isso, utilizamos a seguinte expressão "\(" em seguida o resto da expressão, mas fechando o parênteses no final da expressão para o DDD. "\(" + \d{2} = pattern="^[\(\d{2}) - e a expressão do DD + número, fica da seguinte maneira: pattern="^[\(\d{2})\d{4,5}-\d{4}$" 
        -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
